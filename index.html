<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Zahra A. S.">
    <title>Cat Age Calculator</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="icon" href="assets/img/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="wrapper">
        <img class="pixel-art cat" src="assets/img/cats.gif">
        <main>
            <h1>cat age<br>calculator</h1>

            <!-- int input -->
            <div class="form-set">
                <label class="font-bold" for="catAge">your cat's age:</label>
                <input
                    autofocus
                    class="form-element"
                    id="catAge"
                    type="number"
                    placeholder="age (number)"
                    min="0"
                    max="999"
                >
            </div>
            <div class="form-set">
                <p class="font-bold nowrap">human years:</p>
                <span id="convertedAge" class="nowrap">unknown</span>
            </div>

            <!-- dob input -->
            <div class="form-set dob-toggle">
                <input id="useDOB" type="checkbox"><p class="font-tiny">Input DOB instead (precise)</p>
            </div>

            <div class="form-set dob-field">
                <label class="font-bold" for="catDOB">Your cat's date of birth:</label>
                <div class="form-set">
                    <input
                        class="form-element"
                        type="date"
                        id="catDOB"
                        value="2010-01-01"
                    />
                    <p>(N years old)</p>
                </div>
            </div>

            <footer class="font-tiny">
                <p>art and code by zahra.<br><a href="about.html">source of formula</a> | <a href="https://github.com/zeashel/cat-age-calculator">my github</a></p>
            </footer>

        </main>
    </div>
    <script src="assets/js/catagecalc.js"></script>
</body>
</html>
