<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Zahra A. S.">
    <meta name="description" content="Estimate your cat's human age using Purina's cat-years-to-human-years conversion. Enter your cat's age or date of birth.">
    <title>Cat Age Calculator</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="wrapper">
        <img class="pixel-art cat" src="assets/img/cats.gif">
        <main>
            <h1>cat age<br>calculator</h1>

            <noscript>
                <div class="noscript-div">
                    <p><strong>You have JavaScript disabled.</strong> This calculator requires JavaScript to function.</p>
                </div>
            </noscript>

            <!-- int input + result -->
            <div id="intInput" class="input-wrapper">
                <div class="form-set">
                    <label class="font-bold" for="catAge">your cat's age:</label>
                    <input
                        autofocus
                        class="form-element"
                        id="catAge"
                        type="number"
                        value="1"
                        placeholder="age (number)"
                        min="0"
                        max="999"
                    >
                </div>
                <!-- result -->
                <div class="form-set">
                    <p class="font-bold nowrap">human years:</p>
                    <span id="convertedAge" class="nowrap">unknown</span>
                </div>
            </div>

            <!-- dob input + result (hidden by default) -->
            <div id="dobInput" class="input-wrapper" style="display:none;">
                <div class="form-set dob-field">
                    <label class="font-bold" for="catDOB">Cat's date of birth:</label>
                    <div class="form-set">
                        <input
                            class="form-element"
                            type="date"
                            id="catDOB"
                            value="2015-01-01"
                        />
                        <p>(<span id="catAgeFromDOB" class="nowrap"></span> years old)</p>
                    </div>
                </div>
                <!-- result -->
                <div class="form-set">
                    <p class="font-bold nowrap">human years:</p>
                    <span id="convertedAgeDOB" class="nowrap">unknown</span>
                </div>
            </div>

            <div class="form-set dob-toggle">
                <input id="inputToggleCheckbox" type="checkbox"><p class="font-tiny">Input DOB instead (precise)</p>
            </div>

            <footer class="font-tiny">
                <p>art and code by Zahra.<br><a href="about">source of formula</a> | <a href="https://github.com/zeashel/cat-age-calculator" target="_blank" rel="noopener noreferrer">my github</a></p>
            </footer>

        </main>
    </div>
    <script src="assets/js/intcalc.js" type="module"></script>
    <script src="assets/js/dobcalc.js" type="module"></script>
    <script src="assets/js/inputtoggle.js"></script>
</body>
</html>
